name: Dependency audit

on:
  schedule:
    # Daily at 14:17 UTC. A new advisory fails the run, and GitHub emails
    # whoever last changed this schedule. The publish workflow fails on the
    # same audit, so this warns before a release is blocked.
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Audit dependencies
        run: npm audit --audit-level=low
