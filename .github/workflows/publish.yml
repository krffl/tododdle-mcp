name: Publish Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Runs every install script, check, and test without an npm publish token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} is not on main. Merge it into main first."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Verify package
        run: |
          npm run format:check
          npm run type-check
          npm run test:coverage
          npm audit --audit-level=low

      - name: Pack package
        id: pack
        run: |
          mkdir -p package-artifact
          TARBALL=$(npm pack --pack-destination package-artifact | tail -n 1)
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "package-artifact/${TARBALL}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # No commit SHA for this action could be verified offline when this
      # workflow was split; pin it to a full commit SHA.
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: package-artifact/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # Publishes the tested tarball. It installs nothing and runs no package scripts.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # No commit SHA for this action could be verified offline when this
      # workflow was split; pin it to a full commit SHA.
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: package-artifact

      - name: Verify package checksum
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "${EXPECTED_SHA256}  package-artifact/${TARBALL}" | sha256sum --check --strict

      - name: Publish package
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "package-artifact/${TARBALL}" --provenance --ignore-scripts
